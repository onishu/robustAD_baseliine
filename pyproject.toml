[project]
name = "robustad-benchmark"
version = "0.1.0"
description = "Reproduce PaDiM and PatchCore on the RobustAD benchmark with anomalib."
requires-python = ">=3.10"
dependencies = [
    "anomalib>=2.2",
    "pandas",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
